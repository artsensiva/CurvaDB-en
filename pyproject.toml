[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvadb"
version = "0.1.0"
description = "Curve-based semantic search database using space-filling curves"
authors = [
    {name = "CurvaDB Team", email = "curvadb@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["database", "semantic-search", "curves", "hilbert-curve", "vector-database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sentence-transformers>=2.2.0",
    "hilbertcurve>=2.0.0",
    "lmdb>=1.4.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "pylint>=3.0.0",
    "mypy>=1.5.0",
    "matplotlib>=3.7.0",
]

level2 = [
    "scipy>=1.11.0",
    "scikit-fda>=0.8.0",
    "similaritymeasures>=0.5.0",
    "python-rocksdb>=0.7.0",
    "torch>=2.0.0",
]

level3 = [
    "Fred-Frechet>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.4.0",
    "prometheus-client>=0.18.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/CurvaDB"
Documentation = "https://github.com/yourusername/CurvaDB/docs"
Repository = "https://github.com/yourusername/CurvaDB"
Issues = "https://github.com/yourusername/CurvaDB/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

[tool.pylint.main]
max-line-length = 100
disable = [
    "C0114",  # missing-module-docstring (we use README)
    "C0115",  # missing-class-docstring (we prefer inline docs)
    "R0913",  # too-many-arguments (sometimes necessary)
    "R0801",  # duplicate-code (common in tests)
]
good-names = ["i", "j", "k", "n", "p", "x", "y", "z", "db", "fd", "id"]

[tool.pylint.design]
max-args = 8
max-locals = 20
max-branches = 15

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "hilbertcurve.*",
    "lmdb.*",
    "msgpack.*",
    "sklearn.*",
    "scipy.*",
    "skfda.*",
    "similaritymeasures.*",
    "rocksdb.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/benchmarks/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
